name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Khatwa.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khatwa-apk
          path: Khatwa.apk

      - name: Attach APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Khatwa APK (auto-build)
          body: "Download Khatwa.apk below, open it on your phone, allow install from unknown sources, done."
          files: Khatwa.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
